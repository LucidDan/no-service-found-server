    <head>

        body {
          font-family: system-ui, sans-serif;
          background: #f4f6f8;
          color: #263238;
          display: flex;
          align-items: center;
          justify-content: center;

          margin: 0;
          text-align: center;
        }
        main { max-width: 500px; padding: 2rem; }
        h1 { font-size: 2rem; }
        p { color: #607d8b; line-height: 1.6; }
